name: Maps Scraper

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"  # Every 1 hour

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Run Email Extractor
        run: |
          if [ -f business_websites.csv ]; then
            python website_email_extractor.py
          else
            echo "No websites CSV yet, skipping"
          fi

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped_data
          path: |
            business_websites.csv
            business_emails.csv
            completed_queries.txt
            failed_queries.txt

      - name: Commit Progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add business_websites.csv || true
          git add business_emails.csv || true
          git add completed_queries.txt || true
          git add failed_queries.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto scraper progress update [skip ci]"
            git push
          fi
